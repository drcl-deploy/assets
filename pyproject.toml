[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drcl-sim-assets"
version = "0.1.0"
description = "Simulation assets for training and sim-to-sim workflows"
readme = "readme.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Lokesh Krishna" }]
dependencies = [
    "numpy",
    "platformdirs",
    "trimesh",
]

[project.urls]
Repository = "https://github.com/drcl-deploy/assets"

[project.scripts]
assets = "assets.cli:main"

[project.optional-dependencies]
authoring = ["Pillow"]
decompose = ["coacd"]
test = ["build", "pytest"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["assets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/load_*_isaaclab.py" = ["E402"]
